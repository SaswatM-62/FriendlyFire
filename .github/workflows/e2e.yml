# The whole stack in Docker Compose, driven through a browser (Playwright).
# Not part of ci-ok yet: it becomes a required pull request check from Sprint 3, once
# the quiz flow exists. Add the `run-e2e` label to a pull request to run it there.
name: E2E

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # nightly, 06:00 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright smoke test
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 900
      - run: make e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v
