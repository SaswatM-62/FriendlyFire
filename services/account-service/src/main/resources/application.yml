# Everything comes from environment variables (see .env.example at the repo root).
# The defaults let you run the service outside Docker against `make up`.
spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:friendlyfire}?currentSchema=account
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Give up on a connection quickly, inside the 1-second health deadline.
      connection-timeout: 750
  flyway:
    # Migrations and their history table live in this service's own schema.
    schemas: account
    default-schema: account
    # Postgres may still be starting: retry for about a minute (waits 1, 2, 4, then 5 s).
    connect-retries: 14
    connect-retries-interval: 5s
  grpc:
    server:
      port: ${GRPC_PORT:9091}
      health:
        # grpc.health.v1 only answers "am I running?" (Docker's liveness check), so it
        # must not follow Actuator's health, which includes Postgres.
        schedule:
          enabled: false
    client:
      channel:
        matchdata:
          target: ${MATCHDATA_GRPC_ADDR:localhost:9095}
        scoring:
          target: ${SCORING_GRPC_ADDR:localhost:9094}
  devtools:
    livereload:
      enabled: false

friendlyfire:
  # The mock RSO as this service calls it (inside Docker) ...
  mock-rso-url: ${MOCK_RSO_URL:http://localhost:8090}
  # ... and as the player's browser reaches it, for the Riot link page.
  mock-rso-browser-url: ${MOCK_RSO_BROWSER_URL:http://localhost:8090}
