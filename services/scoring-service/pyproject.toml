[project]
name = "scoring-service"
version = "0.1.0"
description = "Turns answers into points and stores finished quizzes (gRPC)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # grpcio* and protobuf must match the Buf plugins in buf.gen.yaml.
    "grpcio==1.84.1",
    "grpcio-health-checking==1.84.1",
    "grpcio-reflection==1.84.1",
    "protobuf==7.36.2",
    "pydantic-settings==2.16.1",
    "psycopg[binary,pool]==3.3.6",
    "psycopg-pool==3.3.3",
    "friendlyfire-proto",
    "alembic==1.20.1",
    "sqlalchemy==2.1.6",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.2",
    "testcontainers[postgres]==4.15.0",
    "types-grpcio==1.84.0.20261021",
    "types-grpcio-health-checking==1.0.0.20261021",
    "types-grpcio-reflection==1.0.0.20260508",
    "watchfiles==1.3.0",
]

[tool.uv.sources]
friendlyfire-proto = { path = "../../gen/python", editable = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests need Docker: run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = ["integration: needs Docker (Testcontainers)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60

[tool.coverage.run]
source_pkgs = ["scoring"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# TODO comments quote ranges like "5–20" from the .proto files.
allowed-confusables = ["–"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
# The generated *_pb2_grpc.py files have no type annotations.
untyped_calls_exclude = ["friendlyfire"]
